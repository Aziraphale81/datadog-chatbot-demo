apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-worker-hpa
  namespace: chat-demo
  labels:
    app: chat-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
