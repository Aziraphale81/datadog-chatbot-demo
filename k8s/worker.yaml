# Chat worker: required for /chat (consumes RabbitMQ, calls OpenAI).
# replicas: 1 is the intended default. Chaos demos ("Worker crash", "Queue backup") scale
# this deployment to 0; that survives Docker Desktop restarts. If the UI times out on chat,
# run: ./scripts/ensure-chat-ready.sh  (or: kubectl scale deployment/chat-worker -n chat-demo --replicas=1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-worker
  namespace: chat-demo
  labels:
    app: chat-worker
    tags.datadoghq.com/service: chat-worker
    tags.datadoghq.com/env: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-worker
  template:
    metadata:
      labels:
        app: chat-worker
        tags.datadoghq.com/service: chat-worker
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/version: "1.0.0"
        team: chatbot
        admission.datadoghq.com/enabled: "true"
      annotations:
        ad.datadoghq.com/chat-worker.logs: '[{"source":"python","service":"chat-worker"}]'
    spec:
      initContainers:
        - name: wait-for-trace-agent
          image: busybox:latest
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command:
            - sh
            - -c
            - |
              until wget -qO- http://$DD_AGENT_HOST:8126/info >/dev/null 2>&1; do
                echo "waiting for Datadog trace agent..."; sleep 2
              done
      containers:
        - name: chat-worker
          image: chat-worker:latest
          imagePullPolicy: Never
          env:
            # Datadog Configuration
            - name: DD_SERVICE
              value: "chat-worker"
            - name: DD_ENV
              value: "demo"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_URL
              value: "http://$(DD_AGENT_HOST):8126"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1.0"
            - name: DD_TRACE_ENABLED
              value: "true"
            # Data Streams Monitoring - KEY CONFIG
            - name: DD_DATA_STREAMS_ENABLED
              value: "true"
            - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
              value: "true"
            
            # RabbitMQ Configuration
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: REQUEST_QUEUE
              value: "chat_requests"
            - name: RESPONSE_QUEUE
              value: "chat_responses"
            
            # OpenAI Configuration
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-key
                  key: openai-api-key
            - name: OPENAI_MODEL
              value: "gpt-5-nano"
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import os, time, sys
                  f = '/tmp/worker_heartbeat'
                  if not os.path.exists(f):
                    sys.exit(0)
                  age = time.time() - os.path.getmtime(f)
                  sys.exit(0 if age < 120 else 1)
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

